# Push a tag like v1.2.0 → GitHub builds HdrSwitch.exe from this exact commit and publishes a release
# with the exe and its SHA256 checksum. The app's updater only installs files whose checksum matches.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: |
          set TAG=${{ github.ref_name }}
          call build.cmd %TAG:~1%

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash HdrSwitch.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  HdrSwitch.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" HdrSwitch.exe SHA256SUMS.txt --title "HDR Switch ${{ github.ref_name }}" --generate-notes
